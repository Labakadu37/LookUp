// ============================================================
//   PUBLISH HELP — build.gradle (module :app)
// ============================================================

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.publishhelp.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.publishhelp.app"
        minSdk 26          // Android 8.0+ (foreground service overlay)
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // ── Socket.IO pour la communication avec le bot ──
    implementation('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }
}
